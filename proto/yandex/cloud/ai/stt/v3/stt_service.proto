syntax = "proto3";

package speechkit.stt.v3;

import "yandex/cloud/ai/stt/v3/stt.proto";

// Trimmed copy of yandex-cloud/cloudapi stt_service.proto: only the streaming recognizer,
// without google.api / yandex.cloud.operation annotations (we don't need AsyncRecognizer here).
service Recognizer {
  rpc RecognizeStreaming(stream StreamingRequest) returns (stream StreamingResponse);
}
